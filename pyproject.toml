[project]
name = "n4-ide"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "graphviz>=0.21",
    "matplotlib>=3.10.8",
    "n4",
    "numpy>=2.4.4",
    "pyqt6>=6.10.2",
    "pyqt6-qscintilla>=2.14.1",
    "ty>=0.0.29",
]

[tool.uv.sources]
n4 = { git = "https://github.com/kanogame/n4" }

[tool.setuptools.package-data]
n4 = ["py.typed"]

[mypy-graphviz]
ignore_missing_imports = true
